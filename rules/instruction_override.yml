title: Instruction override
id: 1b7e0a4c-6d21-4f0a-9c3e-0a11b20c1001
status: experimental
description: Prompt text that tells the model to drop earlier instructions.
author: emmanuelstanleyamoah
date: 2026/11/17
logsource:
  product: llm_gateway
  category: prompt
detection:
  selection:
    prompt|contains:
      - ignore previous instructions
      - ignore all previous instructions
      - ignore prior instructions
      - disregard your previous instructions
      - forget your prior instructions
  condition: selection
level: high
tags:
  - llm.prompt_injection
  - llm.instruction_override
falsepositives:
  - Training material that quotes the phrase
